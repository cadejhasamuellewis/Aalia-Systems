<svg viewBox="0 0 1400 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Aalia Systems Logo - Full Horizontal -->
  
  <defs>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Large "A" with binary pattern -->
  <g id="letter-a">
    <!-- Left stroke of A -->
    <path d="M 30 260 L 110 20 L 155 20 L 235 260 Z" fill="#2B2C34" stroke="none"/>
    
    <!-- Horizontal crossbar -->
    <rect x="55" y="135" width="165" height="32" fill="#2B2C34" rx="3"/>
    
    <!-- Binary code pattern (0101) inside the A -->
    <g font-family="monospace" font-size="18" font-weight="bold" fill="#00E5FF" opacity="0.7" letter-spacing="2">
      <text x="68" y="90">0</text>
      <text x="95" y="108">1</text>
      <text x="78" y="128">0</text>
      <text x="105" y="145">1</text>
    </g>
  </g>
  
  <!-- Small cyan dot accent -->
  <circle cx="285" cy="55" r="20" fill="#00E5FF" filter="url(#glowEffect)"/>
  
  <!-- "alia" text -->
  <text x="320" y="240" font-family="'Space Grotesk', sans-serif" font-size="100" font-weight="700" fill="#2B2C34" letter-spacing="-3">alia</text>
  
  <!-- "SYSTEMS" text -->
  <text x="880" y="240" font-family="'Space Grotesk', sans-serif" font-size="100" font-weight="700" fill="#2B2C34" letter-spacing="2">SYSTEMS</text>
  
  <!-- Cyan underline accent -->
  <line x1="880" y1="260" x2="1280" y2="260" stroke="#00E5FF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
  
</svg>